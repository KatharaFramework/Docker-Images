name: Docker CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: [self-hosted]
    outputs:
      dirs: ${{ steps.setdirs.outputs.dirs }}
      core: ${{ steps.setdirs.outputs.core }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: setdirs
        shell: bash
        run: |
          changed=$(git diff --name-only origin/main...HEAD)

          core_changed=$(echo "$changed" | grep -q '^core/' && echo "true" || echo "false")

          if [ "$core_changed" = "true" ]; then
            dirs='["ALL"]'
          else
            dirs=$(echo "$changed" \
              | cut -d/ -f1 \
              | sort -u \
              | grep -v '^\.github$' \
              | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "core=$core_changed" >> $GITHUB_OUTPUT
          echo "dirs=$dirs" >> $GITHUB_OUTPUT

  build:
    needs: detect
    runs-on: [self-hosted]
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.dirs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.dir }}" = "ALL" ]; then
            echo "Core changed → building everything"
            make all-multi \
              REGISTRY=ghcr.io \
              IMAGE_NAMESPACE=${{ github.repository_owner }} \
              PUSH="${{ github.event_name == 'push' && '--push' || '--load' }}"
          else
            echo "Building ${{ matrix.dir }}"
            make build_multi_${{ matrix.dir }} \
              REGISTRY=ghcr.io \
              IMAGE_NAMESPACE=${{ github.repository_owner }} \
              PUSH="${{ github.event_name == 'push' && '--push' || '--load' }}"
          fi
